<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Figuras Geométricas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Figuras Geométricas</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-text>Figura Geométrica:</ion-text>
    <ion-item>
      <ion-select
        placeholder="Seleccione una figura"
        [(ngModel)]="figuraSeleccionada"
        interface="popover"
      >
        <ion-select-option value="circulo">Círculo</ion-select-option>
        <ion-select-option value="triangulo">Triángulo</ion-select-option>
      </ion-select>
    </ion-item>

    <app-circulo *ngIf="figuraSeleccionada === 'circulo'"></app-circulo>
    <app-triangulo *ngIf="figuraSeleccionada === 'triangulo'"></app-triangulo>
  </div>
</ion-content>
